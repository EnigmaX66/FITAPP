name: fitness_app
description: Fitness App con sensores, biometria y GPS para UPFIM.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  pedometer: ^4.0.2
  sensors_plus: ^6.1.1
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/iconapp.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

